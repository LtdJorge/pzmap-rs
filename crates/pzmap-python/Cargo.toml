[package]
name = "pzmap-python"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "_pzmap"
crate-type = ["cdylib"]

[dependencies]
libpzmap = { path = "../libpzmap", version = "0.1.0" }
yoke = "0.8.3"
pyo3 = { version = "0.29.2", features = ["abi3-py38", "extension-module"] }

[lints]
workspace = true
