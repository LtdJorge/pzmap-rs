name: Release

# Releases one crate. Push a tag named after the crate and its version, such as
# `libpzmap-v0.1.0`. This workflow publishes that crate and creates a GitHub Release with the
# crate's changelog section as its notes. The Rust crates go to crates.io. pzmap-python goes to
# PyPI as the `pzmap` project, as wheels for each platform and a source distribution.
#
# A version that is already published will not be published again. An existing GitHub Release
# is left alone. So the workflow can be run again for a tag, from the Actions tab, to finish a
# release that failed partway.

on:
  push:
    tags:
      - "libpzmap-v*"
      - "pzmap2img-v*"
      - "pzmap-tools-v*"
      - "pzmap-python-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "The tag to release, such as libpzmap-v0.1.0"
        required: true
        type: string

permissions:
  contents: read

# Two runs for the same tag would race to publish it.
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      crate: ${{ steps.tag.outputs.crate }}
      version: ${{ steps.tag.outputs.version }}
      registry: ${{ steps.tag.outputs.registry }}
      published: ${{ steps.published.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          # The full history, to check that the tag is on master.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable

      - name: Read the crate and version from the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          crate=${TAG%-v*}
          version=${TAG##*-v}
          case "$crate" in
            libpzmap | pzmap2img | pzmap-tools) registry=crates-io ;;
            pzmap-python) registry=pypi ;;
            *) echo "::error::$TAG does not name a crate this workflow releases"; exit 1 ;;
          esac
          if ! [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$TAG does not end in a version such as -v0.1.0"
            exit 1
          fi
          {
            echo "tag=$TAG"
            echo "crate=$crate"
            echo "version=$version"
            echo "registry=$registry"
          } >> "$GITHUB_OUTPUT"

      - name: Check that the tag matches Cargo.toml
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          manifest=$(cargo metadata --no-deps --format-version 1 --locked \
            | jq -r --arg name "$CRATE" '.packages[] | select(.name == $name) | .version')
          if [ "$manifest" != "$VERSION" ]; then
            echo "::error::The tag says $CRATE $VERSION, but Cargo.toml says $manifest"
            exit 1
          fi

      - name: Check that the tag is on master
        run: |
          if ! git merge-base --is-ancestor HEAD origin/master; then
            echo "::error::The tagged commit is not on master. Push master first."
            exit 1
          fi

      # The release notes are the changelog section for this version, from its heading to the
      # next heading or to the links at the end of the file.
      - name: Read the release notes
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          awk -v heading="## [$VERSION]" '
            index($0, heading) == 1 { found = 1; next }
            found && (/^## \[/ || /^\[[^]]+\]: /) { exit }
            found { print }
          ' "crates/$CRATE/CHANGELOG.md" > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::crates/$CRATE/CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          cat notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-notes
          path: notes.md

      - name: Check whether the registry already has this version
        id: published
        env:
          CRATE: ${{ steps.tag.outputs.crate }}
          VERSION: ${{ steps.tag.outputs.version }}
          REGISTRY: ${{ steps.tag.outputs.registry }}
        run: |
          if [ "$REGISTRY" = crates-io ]; then
            url="https://crates.io/api/v1/crates/$CRATE/$VERSION"
          else
            # PyPI writes pre-releases the Python way: 1.0.0-rc.1 becomes 1.0.0rc1, and
            # 1.0.0-beta becomes 1.0.0b0.
            pep440=$(printf '%s' "$VERSION" \
              | sed -E 's/-(alpha|beta|rc)$/-\1.0/; s/-alpha\.?/a/; s/-beta\.?/b/; s/-rc\.?/rc/')
            if [[ $pep440 == *-* ]]; then
              echo "::error::$VERSION has a pre-release label that PyPI cannot represent"
              exit 1
            fi
            url="https://pypi.org/pypi/pzmap/$pep440/json"
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
            -A "pzmap-rs release workflow (github.com/LtdJorge/pzmap-rs)" "$url")
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT"; echo "$CRATE $VERSION is already on $REGISTRY" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::$REGISTRY answered $status"; exit 1 ;;
          esac

  publish:
    needs: check
    if: needs.check.outputs.registry == 'crates-io' && needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    # The crates.io trusted publisher is set up for this environment. Add required reviewers to
    # it in the repository settings to approve each publication by hand.
    environment: crates-io
    permissions:
      contents: read
      # Lets crates-io-auth-action ask crates.io for a short-lived token.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.check.outputs.tag }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Test
        env:
          CRATE: ${{ needs.check.outputs.crate }}
        run: cargo test -p "$CRATE" --all-features --locked
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish
        env:
          CRATE: ${{ needs.check.outputs.crate }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p "$CRATE"

  # The extension uses Python's stable ABI, from 3.9, so each platform needs only one wheel.
  wheels:
    needs: check
    if: needs.check.outputs.registry == 'pypi' && needs.check.outputs.published == 'false'
    strategy:
      matrix:
        include:
          # manylinux wheels are built in an old Linux container, so they also run on older
          # distributions.
          - name: linux-x86_64
            runner: ubuntu-latest
            target: x86_64
            manylinux: auto
            test: native
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64
            manylinux: auto
            test: native
          # musllinux wheels are for Alpine and other musl distributions. They are tested in an
          # Alpine container.
          - name: musllinux-x86_64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            manylinux: musllinux_1_2
            test: alpine
          - name: musllinux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            manylinux: musllinux_1_2
            test: alpine
          # One wheel for both Apple silicon and Intel Macs. The runner only tests the Apple
          # silicon half.
          - name: macos-universal2
            runner: macos-latest
            target: universal2-apple-darwin
            test: native
          - name: windows-x86_64
            runner: windows-latest
            target: x64
            test: native
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.check.outputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/pzmap-python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.name }}
          path: crates/pzmap-python/dist

      # The tests import the installed wheel, not the sources. Tests that need game files are
      # skipped.
      - if: matrix.test == 'native'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Test the wheel
        if: matrix.test == 'native'
        run: |
          python -m pip install --only-binary=:all: --no-index --find-links crates/pzmap-python/dist pzmap
          python -m pip install pytest
          python -m pytest crates/pzmap-python/tests
      - name: Test the wheel on Alpine
        if: matrix.test == 'alpine'
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3-alpine sh -euc '
            python -m pip install --only-binary=:all: --no-index --find-links crates/pzmap-python/dist pzmap
            python -m pip install pytest
            python -m pytest crates/pzmap-python/tests
          '

  sdist:
    needs: check
    if: needs.check.outputs.registry == 'pypi' && needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.check.outputs.tag }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          working-directory: crates/pzmap-python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: crates/pzmap-python/dist
      # Building from the source distribution checks that it holds everything the build needs,
      # such as libpzmap's sources.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Build and test the source distribution
        run: |
          python -m pip install crates/pzmap-python/dist/*.tar.gz
          python -m pip install pytest
          python -m pytest crates/pzmap-python/tests

  publish-pypi:
    needs: [ check, wheels, sdist ]
    if: needs.check.outputs.registry == 'pypi' && needs.check.outputs.published == 'false'
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for `pzmap` is set up for this environment. Add required reviewers
    # to it in the repository settings to approve each publication by hand.
    environment: pypi
    permissions:
      # Lets the publish action ask PyPI for a short-lived token, and sign the attestations.
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: dist
      - name: List the files
        run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  github-release:
    needs: [ check, publish, publish-pypi ]
    # Runs after a publish, or when the version was already published and the publish jobs were
    # skipped. A failed job anywhere before it stops it.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
          CRATE: ${{ needs.check.outputs.crate }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "A release for $TAG already exists"
            exit 0
          fi
          prerelease=()
          if [[ $VERSION == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" --verify-tag --title "$CRATE $VERSION" --notes-file notes.md \
            "${prerelease[@]}"
