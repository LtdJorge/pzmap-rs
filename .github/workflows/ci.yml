name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# A new push to a branch or PR cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # rustfmt.toml uses options that only nightly rustfmt applies.
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
          components: rustfmt
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # The notices check compares against cargo-about's output, so pin its version.
      - uses: taiki-e/install-action@8cca0918f8471c33515202b73f56ab27f2bed283 # v2.87.29
        with:
          tool: cargo-about@0.9.2,cargo-deny@0.20.2

      - name: Format
        run: cargo +nightly fmt --all --check

      - name: Clippy, default features
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, pzmap2img library only
        run: cargo clippy -p pzmap2img --no-default-features --all-targets --locked -- -D warnings
      - name: Clippy, pzmap2img without WebP
        run: cargo clippy -p pzmap2img --no-default-features --features cli --all-targets --locked -- -D warnings
      - name: Clippy, pzmap-tools terminal only
        run: cargo clippy -p pzmap-tools --no-default-features --features tui --all-targets --locked -- -D warnings
      - name: Clippy, pzmap-tools window only
        run: cargo clippy -p pzmap-tools --no-default-features --features gui --all-targets --locked -- -D warnings

      - name: Docs
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Third-party notices are up to date
        run: cargo run -p xtask --locked -- notices --check

      - name: cargo-deny
        run: cargo deny check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # No system packages are needed on Linux. libwebp-sys compiles its bundled C sources, and
    # the window crates load X11 and Wayland libraries at run time instead of linking them.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test
        run: cargo test --workspace --locked

      - name: Build pzmap2img library only
        run: cargo build -p pzmap2img --no-default-features --locked
      - name: Build pzmap2img without WebP
        run: cargo build -p pzmap2img --no-default-features --features cli --locked
      - name: Build pzmap-tools terminal only
        run: cargo build -p pzmap-tools --no-default-features --features tui --locked
      - name: Build pzmap-tools window only
        run: cargo build -p pzmap-tools --no-default-features --features gui --locked

  msrv:
    # libpzmap supports an older Rust than the rest of the workspace, so it is checked on its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: workspace
            manifest: Cargo.toml
            packages: --workspace
          - name: libpzmap
            manifest: crates/libpzmap/Cargo.toml
            packages: -p libpzmap
    name: msrv (${{ matrix.name }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Read rust-version from the manifest. RUSTUP_TOOLCHAIN overrides the `stable` pin in
      # rust-toolchain.toml for every later step.
      - name: Read rust-version
        env:
          MANIFEST: ${{ matrix.manifest }}
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' "$MANIFEST")
          test -n "$msrv"
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.RUSTUP_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: ${{ matrix.name }}
      - name: Check
        env:
          PACKAGES: ${{ matrix.packages }}
        run: |
          cargo --version
          # PACKAGES holds two words, so it is left unquoted on purpose.
          # shellcheck disable=SC2086
          cargo check $PACKAGES --all-targets --locked

  java:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: crates/pzmap-java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # build.gradle.kts asks for a Java 17 toolchain.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Without PZ_INSTALL_DIR, the tests that read game files are skipped.
      - name: Test
        run: ./gradlew test

  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # The oldest version requires-python allows, and the newest release. setup-python has a
        # 3.9 build for macOS arm64 too.
        python: ["3.9", "3.15"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # pip builds the extension through maturin's PEP 517 backend.
      - name: Install
        run: pip install "./crates/pzmap-python[test]"
      # Without PZ_INSTALL_DIR, the tests that read game files are skipped.
      - name: Test
        run: pytest crates/pzmap-python/tests
