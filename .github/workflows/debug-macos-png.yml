name: Debug macOS PNG

# Temporary. Checks whether the latest Rust nightly still breaks fdeflate on Apple silicon. Push
# this on a branch under `debug/`, not on master, and delete it once the cause is known.
#
# The bisection found that the LLVM 23 update, rust-lang/rust#158734, broke pzmap2img's
# `decode_tile` doctest when fdeflate is optimized with overflow checks on and the test
# profile's thin LTO. This run builds the same doctest with today's nightly. If it fails with
# `CorruptFlateStream`, the bug is still there. If it passes, it may be fixed upstream.

on:
  push:
    branches: ["debug/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  nightly:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: nightly
      - name: Toolchain
        run: |
          uname -m
          rustc +nightly -vV
      # The workspace's Cargo.toml turns off fdeflate's overflow checks as a workaround, and
      # --config turns them back on.
      - name: Doctest on the latest nightly
        run: >-
          cargo +nightly test -p pzmap2img --doc --locked
          --config 'profile.test.package.fdeflate.overflow-checks=true' -- decode_tile
