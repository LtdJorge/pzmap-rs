name: Debug macOS PNG

# Temporary. Looks for a reproduction of the fdeflate failure on Apple silicon that works
# outside this workspace. Push this on a branch under `debug/`, not on master, and delete it
# once the cause is known.
#
# The doctest failed when fdeflate was optimized with overflow checks on, but the reproduction
# passed in a release build with the same settings. The test profile also inherits other dev
# settings: 256 codegen units and full debug info. The `mirror` profile in
# repro/fdeflate-aarch64 copies the test profile, and the steps below change one setting at a
# time.
#
# On x86-64 Linux, every step prints:
#   png file:            333 bytes, sum 50113
#   its zlib stream:     276 bytes, sum 47062
#   fdeflate decompress: 16448 bytes, sum 256
#   fdeflate compress:   276 bytes, sum 47062, same as the png file's stream
#   and back:            16448 bytes, the same rows
#   image decode:        64x64
# A different zlib stream means the compressor is at fault. The same stream with a decode
# error means the decompressor is.

on:
  push:
    branches: ["debug/**"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REPRO: repro/fdeflate-aarch64/Cargo.toml

jobs:
  png:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Install Rust 1.95, to compare with an older compiler
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Toolchain
        run: |
          uname -m
          rustc -vV

      - name: Reproduction, release profile
        continue-on-error: true
        run: cargo run --locked --release --manifest-path "$REPRO"
      - name: Reproduction, the test profile's settings
        continue-on-error: true
        run: cargo run --locked --profile mirror --manifest-path "$REPRO"
      - name: Reproduction, the test profile's settings with 16 codegen units
        continue-on-error: true
        env:
          CARGO_PROFILE_MIRROR_CODEGEN_UNITS: "16"
        run: cargo run --locked --profile mirror --manifest-path "$REPRO"
      - name: Reproduction, the test profile's settings without debug info
        continue-on-error: true
        env:
          CARGO_PROFILE_MIRROR_DEBUG: "false"
        run: cargo run --locked --profile mirror --manifest-path "$REPRO"
      - name: Reproduction, the test profile's settings without LTO
        continue-on-error: true
        env:
          CARGO_PROFILE_MIRROR_LTO: "false"
        run: cargo run --locked --profile mirror --manifest-path "$REPRO"
      - name: Reproduction, the test profile's settings without overflow checks
        continue-on-error: true
        env:
          CARGO_PROFILE_MIRROR_OVERFLOW_CHECKS: "false"
        run: cargo run --locked --profile mirror --manifest-path "$REPRO"
      - name: Reproduction, the test profile's settings, overflow checks only in fdeflate
        continue-on-error: true
        env:
          CARGO_PROFILE_MIRROR_OVERFLOW_CHECKS: "false"
        run: >-
          cargo run --locked --profile mirror --manifest-path "$REPRO"
          --config 'profile.mirror.package.fdeflate.overflow-checks=true'
      - name: Reproduction, the test profile's settings on Rust 1.95
        continue-on-error: true
        run: cargo +1.95.0 run --locked --profile mirror --manifest-path "$REPRO"

      # The override in Cargo.toml turns off fdeflate's overflow checks. Turning them back on
      # should make the doctest fail again.
      - name: Doctest, as on master
        continue-on-error: true
        run: cargo test -p pzmap2img --doc --locked -- decode_tile
      - name: Doctest, with fdeflate's overflow checks back on
        continue-on-error: true
        run: >-
          cargo test -p pzmap2img --doc --locked
          --config 'profile.test.package.fdeflate.overflow-checks=true' -- decode_tile
