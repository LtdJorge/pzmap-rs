name: Debug macOS asm

# Temporary. Dumps the assembly and LLVM IR of pzmap2img's `decode_tile` doctest on Apple silicon,
# for rust-lang/rust#164536. Open a pull request from a branch with this file to run it, and
# close the pull request once the artifact is downloaded.
#
# The doctest is built twice with Rust 1.99.1, once with fdeflate's overflow checks on, which
# fails, and once with them off, which passes. Only fdeflate's overflow checks differ, so a diff
# of the two dumps shows what the checks change. asm-wrapper.sh makes rustc emit the assembly and
# IR next to each doctest binary, and logs the rustc arguments to /tmp/doctest-rustc-args.txt.
#
# The artifact holds target/doctest-out for both builds, with the doctest binaries, and the
# logged rustc arguments.

on:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTC_BOOTSTRAP: "1"

jobs:
  asm:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1

      # The doctest is expected to fail here, so the step goes on to the next build.
      - name: Doctest with overflow checks
        continue-on-error: true
        run: |
          RUSTDOCFLAGS="-Zunstable-options \
            --persist-doctests $PWD/target/doctest-out/overflow-checks \
            --test-builder-wrapper $PWD/asm-wrapper.sh" \
            cargo +1.99.1 test -p pzmap2img --doc --locked \
              --config 'profile.test.package.fdeflate.overflow-checks=true' -- decode_tile
      - name: Keep the rustc arguments
        if: always()
        run: mv /tmp/doctest-rustc-args.txt target/doctest-out/overflow-checks/rustc-args.txt || true

      - name: Doctest without overflow checks
        continue-on-error: true
        run: |
          RUSTDOCFLAGS="-Zunstable-options \
            --persist-doctests $PWD/target/doctest-out/no-overflow-checks \
            --test-builder-wrapper $PWD/asm-wrapper.sh" \
            cargo +1.99.1 test -p pzmap2img --doc --locked \
              --config 'profile.test.package.fdeflate.overflow-checks=false' -- decode_tile
      - name: Keep the rustc arguments
        if: always()
        run: mv /tmp/doctest-rustc-args.txt target/doctest-out/no-overflow-checks/rustc-args.txt || true

      - name: List the dumps
        if: always()
        run: find target/doctest-out -type f -exec ls -l {} +

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: doctest-asm
          path: target/doctest-out
          if-no-files-found: error
