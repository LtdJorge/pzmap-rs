# Settings for cargo-deny, which is run by CI with `cargo deny check`.

[graph]
# The same platforms as about.toml.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]

[advisories]
# Fail on any crate with a RustSec advisory, including unmaintained and unsound crates.
ignore = [
    # zvariant, zvariant_derive and zbus_names were merged into zbus 6. They come from eframe's
    # screen reader support on Linux, through accesskit_unix, which still requires zbus 5. Remove
    # these when accesskit_unix moves to zbus 6.
    { id = "RUSTSEC-2026-0370", reason = "zvariant: unmaintained, not vulnerable; accesskit_unix needs zbus 5" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names: unmaintained, not vulnerable; accesskit_unix needs zbus 5" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive: unmaintained, not vulnerable; accesskit_unix needs zbus 5" },
]

[licenses]
# Keep this list the same as `accepted` in about.toml. Some entries match no crate today.
unused-allowed-license = "allow"
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "0BSD",
    "Unlicense",
    "WTFPL",
    "OFL-1.1",
]

[licenses.private]
# The workspace crates that are not published carry their licenses in their own folders.
ignore = true

[bans]
# Two versions of one crate only make a warning. Several of the GUI crates pull in older copies.
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies inside the workspace have no version requirement, and that is fine.
allow-wildcard-paths = true

[sources]
# Only crates.io. A git dependency or another registry fails the check.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
